[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shpont-probe"
version = "0.1.0"
description = "Poligon (continuous self-attack and posture scoring) and Tripwire (decoys and honeytokens) for an AI control layer"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
shpont-probe = "shpont_probe.cli:main"

[tool.setuptools.packages.find]
include = ["shpont_probe*"]

[tool.setuptools.package-data]
shpont_probe = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["shield: needs the Shpont-Shield control layer importable (SHIELD_PATH)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
