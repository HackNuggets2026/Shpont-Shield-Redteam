[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shield-redteam"
version = "0.1.0"
description = "Poligon (continuous self-attack and posture scoring) and Tripwire (decoys and honeytokens) for an AI control layer"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyyaml>=6", "ruamel.yaml>=0.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
shield-redteam = "shield_redteam.cli:main"

[tool.setuptools.packages.find]
include = ["shield_redteam*"]

[tool.setuptools.package-data]
shield_redteam = ["server/static/*", "server/static/app/*", "server/static/app/assets/*", "server/static/console/*", "server/static/console/views/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["shield: needs the Shpont-Shield control layer importable (SHIELD_PATH)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
